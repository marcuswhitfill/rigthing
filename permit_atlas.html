<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111111"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>permits · duckdb</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<style>
html,body{margin:0;height:100%;height:100dvh;background:#111;color:#ddd;font:12px/1.35 ui-monospace,Consolas,monospace;overflow:hidden}
#map{position:absolute;inset:0}
#ui{position:absolute;top:8px;left:8px;z-index:5;width:300px;background:#111c;border:1px solid #333;padding:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#grab,#tog{display:none}
#ui b{font-size:12px}
#head{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ui .n{color:#aaa;margin:4px 0 8px}
select,input{width:100%;background:#1a1a1a;color:#ddd;border:1px solid #444;padding:4px;margin:3px 0;box-sizing:border-box}
#row3d{display:flex;gap:8px;align-items:center;margin:4px 0}
#btn3d{background:#1a1a1a;color:#ddd;border:1px solid #444;padding:6px 10px;min-height:32px;font:12px ui-monospace,Consolas,monospace}
#btn3d.on{border-color:#e07830;color:#ffb060}
#row3d label{flex:1;display:flex;align-items:center;gap:6px;color:#888}
#row3d input[type=range]{flex:1;min-height:24px;margin:0}
#list{max-height:42vh;overflow:auto;margin-top:6px;-webkit-overflow-scrolling:touch}
#list div{display:flex;justify-content:space-between;cursor:pointer;padding:2px 0;border-bottom:1px solid #222}
#list div:hover{color:#fff}
a{color:#9cf}
.maplibregl-popup-content{background:#141414;color:#eee;border:1px solid #e07830;padding:0;border-radius:0;font:12px/1.35 ui-monospace,Consolas,monospace;min-width:240px}
.maplibregl-popup-tip{border-top-color:#141414}
.idbox{padding:10px 12px}
.idbox .id{font-size:13px;font-weight:700;color:#ffb060;margin-bottom:6px}
.idbox .row{color:#ccc}
.idbox .k{color:#888;display:inline-block;width:52px}
#bar{height:3px;background:#1a1a1a;margin:4px 0 8px}
#bar i{display:block;height:100%;width:0;background:#e07830}
@media (max-width:720px){
  #ui{top:auto;left:0;right:0;bottom:0;width:auto;max-height:42dvh;border-radius:14px 14px 0 0;border-left:0;border-right:0;border-bottom:0;padding:6px 14px calc(10px + env(safe-area-inset-bottom))}
  #ui.shut{max-height:none}
  #ui.shut #list,#ui.shut .hint{display:none}
  #grab{display:block;width:40px;height:4px;background:#555;border-radius:2px;margin:2px auto 8px}
  #tog{display:inline-block;background:#1a1a1a;color:#ddd;border:1px solid #444;padding:6px 10px;min-height:36px;font:12px ui-monospace,Consolas,monospace}
  select,input{min-height:40px;font-size:16px;margin:4px 0}
  #list div{padding:8px 0;min-height:36px;align-items:center}
  .maplibregl-ctrl-top-right{top:env(safe-area-inset-top,8px);right:8px}
  .maplibregl-popup-content{min-width:0;max-width:min(92vw,300px)}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="ui" class="shut">
  <div id="grab"></div>
  <div id="head">
    <b>active permits</b>
    <button id="tog" type="button">basins</button>
  </div>
  <div id="bar"><i id="fill"></i></div>
  <div class="n" id="stats">loading duckdb-wasm…</div>
  <input id="q" placeholder="operator / well / API" enterkeyhint="search" autocomplete="off"/>
  <select id="basin"><option value="">all basins</option></select>
  <div id="row3d">
    <button type="button" id="btn3d">3D</button>
    <label>exag <input id="vex" type="range" min="1" max="15" value="5"/></label>
  </div>
  <div id="list"></div>
  <div class="n hint">parquet · duckdb-wasm · SH ↓ TVD → BH</div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<script type="module">
import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm";

const PAL = [[232,120,48],[80,180,220],[120,200,120],[220,90,120],[180,150,255],[255,200,80],[90,220,190],[220,180,140]];
function pal(i){ return PAL[(i||0)%PAL.length]; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ident(s){ return /^[A-Za-z0-9 _./&+-]{0,80}$/.test(s||"") ? (s||"") : ""; }
function vex(){ return Number(document.getElementById("vex")?.value || 5); }
function wellPath(d){
  const lon = Number(d.lon), lat = Number(d.lat);
  const dep = Number(d.depth_ft);
  const z = (Number.isFinite(dep) && dep > 0) ? -dep * 0.3048 * vex() : 0;
  const hasBh = d.blat != null && d.blon != null &&
    Math.abs(Number(d.blat)-lat)+Math.abs(Number(d.blon)-lon) > 1e-4;
  if (!hasBh) return [[lon, lat, 0], [lon, lat, z]];
  return [[lon, lat, 0], [lon, lat, z], [Number(d.blon), Number(d.blat), z]];
}
function res(z){
  if (z<4) return 2;
  if (z<5) return 1;
  if (z<6) return 0.5;
  if (z<7) return 0.25;
  if (z<8) return 0.1;
  if (z<9) return 0.05;
  if (z<10) return 0.02;
  if (z<11) return 0.008;
  return 0;
}
const SCORE = "coalesce(day,0)*1e6 + coalesce(lateral_ft,0)";
const FALLBACK = {version:8, sources:{}, layers:[{id:"bg", type:"background", paint:{"background-color":"#111"}}]};

const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
  center: [-104, 42], zoom: 3.3, pitch: 0, maxPitch: 80,
  dragRotate: true, touchPitch: true, attributionControl: true
});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), "top-right");
map.on("error", e => {
  if (e.error && !map.isStyleLoaded()) map.setStyle(FALLBACK);
});

let deckgl = null, conn = null, ready = false, tq = null, popup = null, basinIdx = {};
function st(t){ document.getElementById("stats").textContent = t; }
function bar(p){ document.getElementById("fill").style.width = (100*Math.max(0,Math.min(1,p)))+"%"; }

function syncDeck(){
  if (!deckgl) return;
  const c = map.getCenter();
  deckgl.setProps({
    viewState: {
      longitude: c.lng, latitude: c.lat, zoom: map.getZoom(),
      bearing: map.getBearing(), pitch: map.getPitch(),
      maxPitch: 80, position: [0, 0, 0]
    }
  });
}
function attachDeck(){
  if (deckgl) { try { deckgl.finalize(); } catch(e) {} deckgl = null; }
  deckgl = new deck.Deck({
    parent: map.getContainer(),
    style: {position:"absolute", left:"0", top:"0", width:"100%", height:"100%", pointerEvents:"none"},
    views: [new deck.MapView({repeat:true, farZMultiplier: 2.8})],
    controller: false, useDevicePixels: true, layers: []
  });
  syncDeck();
}
map.on("move", syncDeck);
map.on("resize", syncDeck);

function idHtml(r){
  const n = Number(r.n||1);
  return `<div class="idbox">
    <div class="id">${esc(r.api||"(no API)")}${n>1?"  ×"+n:""}</div>
    <div class="row"><span class="k">well</span>${esc(r.well)}</div>
    <div class="row"><span class="k">op</span>${esc(r.operator)}</div>
    <div class="row"><span class="k">basin</span>${esc(r.basin)} · ${esc(r.county)} ${esc(r.state)}</div>
    <div class="row"><span class="k">type</span>${esc(r.permit_type)} · ${esc(r.well_type)} · ${esc(r.traj)}</div>
    <div class="row"><span class="k">form</span>${esc(r.formation)}</div>
    <div class="row"><span class="k">depth</span>${r.depth_ft??"—"} ft · lat ${r.lateral_ft??"—"} ft</div>
    <div class="row"><span class="k">SH</span>${Number(r.lat).toFixed(5)}, ${Number(r.lon).toFixed(5)}</div>
    ${r.blat!=null?`<div class="row"><span class="k">BH</span>${Number(r.blat).toFixed(5)}, ${Number(r.blon).toFixed(5)}</div>`:""}
    <a href="https://maps.google.com/?q=${r.lat},${r.lon}" target="_blank">maps</a>
  </div>`;
}
function openBox(r, lngLat){
  if (popup) popup.remove();
  popup = new maplibregl.Popup({maxWidth:"300px", offset:12}).setLngLat(lngLat).setHTML(idHtml(r)).addTo(map);
}
map.on("click", ev => {
  if (!deckgl) return;
  const info = deckgl.pickObject({x: ev.point.x, y: ev.point.y, radius: 12});
  if (info && info.object && info.object.lat!=null)
    openBox(info.object, [info.coordinate[0], info.coordinate[1]]);
});

function where(){
  const b = map.getBounds();
  const z = map.getZoom();
  const r = res(z) || 0.003;
  const parts = [
    `lat BETWEEN ${b.getSouth()-r} AND ${b.getNorth()+r}`,
    `lon BETWEEN ${b.getWest()-r} AND ${b.getEast()+r}`,
  ];
  const basin = ident(document.getElementById("basin").value);
  if (basin) parts.push(`basin = '${basin}'`);
  const q = document.getElementById("q").value.replace(/'/g,"").toLowerCase().slice(0,80);
  if (q) parts.push(`(lower(coalesce(operator,'')) LIKE '%${q}%' OR lower(coalesce(well,'')) LIKE '%${q}%' OR lower(coalesce(api,'')) LIKE '%${q}%')`);
  return {sql: parts.join(" AND "), z, r, basin};
}

async function redraw(){
  if (!ready || !deckgl) return;
  const {sql, z, r, basin} = where();
  const t = Math.max(0, Math.min(1, (z-3.5)/6.5));
  const t0 = performance.now();
  let wells = [], lines = [], mode = "cells";
  if (z >= 8) {
    mode = "wells";
    const [w, L] = await Promise.all([
      conn.query(`SELECT api, operator, well, permit_type, well_type, traj, formation, county, state,
                         lat, lon, blat, blon, depth_ft, lateral_ft, basin, 1 AS n
                  FROM permits WHERE ${sql} ORDER BY day DESC NULLS LAST LIMIT 12000`),
      conn.query(`SELECT api, operator, well, permit_type, well_type, traj, formation, county, state,
                         lat, lon, blat, blon, depth_ft, lateral_ft, basin, 1 AS n
                  FROM permits WHERE ${sql}
                    AND blat IS NOT NULL AND blon IS NOT NULL
                    AND abs(blat-lat)+abs(blon-lon) > 1e-4
                  ORDER BY day DESC NULLS LAST LIMIT 4000`),
    ]);
    wells = w.toArray();
    lines = L.toArray();
  } else {
    const [c, L] = await Promise.all([
      conn.query(`SELECT count(*)::INT AS n,
        arg_max(api, ${SCORE}) AS api, arg_max(operator, ${SCORE}) AS operator,
        arg_max(well, ${SCORE}) AS well, arg_max(permit_type, ${SCORE}) AS permit_type,
        arg_max(well_type, ${SCORE}) AS well_type, arg_max(traj, ${SCORE}) AS traj,
        arg_max(formation, ${SCORE}) AS formation, arg_max(county, ${SCORE}) AS county,
        arg_max(state, ${SCORE}) AS state, arg_max(lat, ${SCORE}) AS lat,
        arg_max(lon, ${SCORE}) AS lon, arg_max(blat, ${SCORE}) AS blat,
        arg_max(blon, ${SCORE}) AS blon, arg_max(depth_ft, ${SCORE}) AS depth_ft,
        arg_max(lateral_ft, ${SCORE}) AS lateral_ft, arg_max(basin, ${SCORE}) AS basin
        FROM permits WHERE ${sql}
        GROUP BY round(lat/${r})*${r}, round(lon/${r})*${r}
        ORDER BY n DESC LIMIT 6000`),
      conn.query(`SELECT api, operator, well, permit_type, well_type, traj, formation, county, state,
                         lat, lon, blat, blon, depth_ft, lateral_ft, basin, 1 AS n
                  FROM permits WHERE ${sql}
                    AND blat IS NOT NULL AND blon IS NOT NULL
                    AND abs(blat-lat)+abs(blon-lon) > 1e-4
                  ORDER BY day DESC NULLS LAST LIMIT 2500`),
    ]);
    wells = c.toArray();
    lines = L.toArray();
  }
  const ms = (performance.now()-t0).toFixed(0);
  st(`${mode}  ·  ${wells.length.toLocaleString()} pts  ·  ${lines.length} laterals  ·  ${ms}ms sql  ·  z ${z.toFixed(1)}`);
  const raw = mode === "wells";
  deckgl.setProps({
    layers: [
      new deck.ScatterplotLayer({
        id: "wells", data: wells,
        getPosition: d => [Number(d.lon), Number(d.lat), 0],
        getFillColor: d => {
          const c = pal(basinIdx[d.basin]||0);
          const a = raw ? Math.round(90+t*140) : Math.round(30+t*80+Math.min(50, Math.log10(Number(d.n||1)+1)*16));
          return [c[0], c[1], c[2], a];
        },
        getRadius: d => raw ? (8+t*24) : (30 + Math.log10(Number(d.n||1)+1)*90 + t*60),
        radiusMinPixels: raw ? 1.6+t*2 : 1.2+t*2,
        radiusMaxPixels: raw ? 6+t*6 : 16+t*10,
        pickable: true, updateTriggers: {getFillColor:[t,mode], getRadius:[t,mode]}
      }),
      new deck.PathLayer({
        id: "bores", data: lines,
        getPath: wellPath,
        getColor: d => { const c = pal(basinIdx[d.basin]||0); return [c[0],c[1],c[2], 200]; },
        getWidth: 12, widthMinPixels: 1.6, widthMaxPixels: 6,
        capRounded: true, jointRounded: true, billboard: false,
        pickable: true, updateTriggers: {getPath: vex()}
      }),
      new deck.TextLayer({
        id: "lab", data: (raw && t>0.55) ? wells.slice(0, 400) : [],
        getText: d => d.api || d.well || "",
        getPosition: d => [Number(d.lon), Number(d.lat), 0],
        getSize: 11, sizeUnits: "pixels",
        getColor: [255,224,170,200], getPixelOffset: [0,-14],
        fontFamily: "Consolas, ui-monospace, monospace",
        outlineWidth: 8, outlineColor: [10,10,10,255], pickable: true
      })
    ]
  });
  syncDeck();
}

async function boot(){
  attachDeck();
  st("fetch permits.zstd.parquet…");
  const bundles = duckdb.getJsDelivrBundles();
  const bundle = await duckdb.selectBundle(bundles);
  const worker = new Worker(URL.createObjectURL(new Blob(
    [`importScripts("${bundle.mainWorker}");`], {type:"text/javascript"})));
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  const res = await fetch("permits.zstd.parquet");
  if (!res.ok) throw new Error("parquet HTTP "+res.status);
  const total = Number(res.headers.get("content-length")||0);
  let got = 0;
  const reader = res.body.getReader();
  const chunks = [];
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.byteLength;
    if (total) bar(got/total);
    st("parquet "+(got/1e6).toFixed(1)+" MB"+(total?(" / "+(total/1e6).toFixed(1)): ""));
  }
  const buf = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.byteLength; }
  bar(1);
  await db.registerFileBuffer("permits.parquet", buf);
  conn = await db.connect();
  await conn.query(`
    CREATE VIEW permits AS
    SELECT basin, operator, well, permit_type, well_type, traj, formation,
           depth_ft, lateral_ft, county, state, api, day,
           lat_i * 1e-7 AS lat, lon_i * 1e-7 AS lon,
           blat_i * 1e-7 AS blat, blon_i * 1e-7 AS blon
    FROM read_parquet('permits.parquet')`);
  const n = (await conn.query("SELECT count(*) AS n FROM permits")).toArray()[0].n;
  const basins = (await conn.query("SELECT basin, count(*)::INT n FROM permits GROUP BY 1 ORDER BY n DESC")).toArray();
  basins.forEach((b,i) => { basinIdx[b.basin] = i; });
  const sel = document.getElementById("basin");
  const list = document.getElementById("list");
  basins.forEach(b => {
    const o = document.createElement("option");
    o.value = b.basin; o.textContent = b.basin+" "+Number(b.n).toLocaleString();
    sel.appendChild(o);
    const d = document.createElement("div");
    d.innerHTML = `<span>${esc(b.basin)}</span><span>${Number(b.n).toLocaleString()}</span>`;
    d.onclick = async () => { sel.value = b.basin; await fitBasin(b.basin); };
    list.appendChild(d);
  });
  st(Number(n).toLocaleString()+" rows  ·  "+(buf.byteLength/1e6).toFixed(1)+" MB parquet  ·  wasm");
  ready = true;
  await redraw();
}

async function fitBasin(name){
  const x = (await conn.query(
    `SELECT min(lat) a, max(lat) b, min(lon) c, max(lon) d FROM permits WHERE basin='${ident(name)}'`
  )).toArray()[0];
  if (x && x.a!=null) {
    const ui = document.getElementById("ui");
    const h = ui.getBoundingClientRect().height;
    const phone = window.matchMedia("(max-width:720px)").matches;
    map.fitBounds([[x.c,x.a],[x.d,x.b]], {
      padding: phone ? {top:12,left:12,right:12,bottom:Math.round(h+12)} : 40,
      maxZoom: 8
    });
  }
  await redraw();
}

boot().catch(e => { st(String(e)); console.error(e); });
map.once("load", () => { attachDeck(); if (ready) redraw(); });
map.on("style.load", () => { attachDeck(); if (ready) redraw(); });
map.on("moveend", () => { if (ready) redraw(); });
map.on("zoomend", () => { if (ready) redraw(); });

document.getElementById("basin").onchange = () => {
  const v = document.getElementById("basin").value;
  if (v) fitBasin(v); else redraw();
};
document.getElementById("q").oninput = () => { clearTimeout(tq); tq = setTimeout(() => redraw(), 140); };
let three = false;
document.getElementById("btn3d").onclick = () => {
  three = !three;
  document.getElementById("btn3d").classList.toggle("on", three);
  map.easeTo({pitch: three ? 58 : 0, bearing: three ? -22 : 0, duration: 600});
};
document.getElementById("vex").oninput = () => { if (ready) redraw(); };
const ui = document.getElementById("ui");
const tog = document.getElementById("tog");
function setOpen(open){
  ui.classList.toggle("shut", !open);
  tog.textContent = open ? "hide" : "basins";
  if (map.resize) map.resize();
  syncDeck();
}
tog.onclick = () => setOpen(ui.classList.contains("shut"));
document.getElementById("grab").onclick = () => setOpen(ui.classList.contains("shut"));
</script>
</body>
</html>
